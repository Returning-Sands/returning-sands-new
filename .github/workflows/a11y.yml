name: Accessibility and size gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # tsc, eslint, vitest, next build (Req 21.3). Fails on any dynamic route.
      - run: npm run build
        env:
          CI: true

      # next start + Playwright: axe (tests/a11y) and behavioural (tests/e2e).
      - run: npm run test:e2e
        env:
          CI: true

      # Home route first-party JS budget, 200 KB gzip (Req 19.5).
      - run: npm run size

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
